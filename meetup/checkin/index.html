<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>聚會報到</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@900&display=swap">
<style>
:root {
  --ink: #24201d;
  --paper: #e5e4e2;
  --card: #f4f3f1;
  --line: #cbc9c5;
  --muted: #6d6964;
  --on-ink: #f4f1ec;
  --on-ink-muted: #b4aea7;
  --orange: #e68a4a;
  --orange-deep: #a8551d;
  --ok: #1f6b45;
  --ok-bg: #d8eadf;
  --warn: #84560b;
  --warn-bg: #f5e6c6;
  --bad: #a12c24;
  --bad-bg: #f5d9d6;
  --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --serif: "Noto Serif TC", "Songti TC", serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { background: var(--ink); color: var(--on-ink); padding-top: env(safe-area-inset-top, 0px); }
header .wrap { padding-block: 20px 18px; display: flex; flex-direction: column; gap: 12px; }
.event { font-size: 14px; color: var(--on-ink-muted); }
h1 { margin: 0; font-family: var(--serif); font-weight: 900; font-size: 28px; line-height: 1.25; }
.count { display: flex; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; }
.count b { font-size: 42px; line-height: 1; color: var(--orange); font-weight: 700; }
.count span { color: var(--on-ink-muted); }
.bar { height: 6px; background: #4a443f; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--orange); }
main .wrap { padding-block: 16px 40px; display: flex; flex-direction: column; gap: 14px; }
.lock { display: flex; flex-direction: column; gap: 10px; }
.big { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 64px; background: var(--orange); border: 0; color: var(--ink); font-size: 20px; font-weight: 700; }
.camera { position: relative; background: #000; aspect-ratio: 1 / 1; overflow: hidden; }
.camera video { width: 100%; height: 100%; object-fit: cover; display: block; }
.frame { position: absolute; inset: 14%; border: 3px solid var(--orange); pointer-events: none; }
.result { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.result.ok { background: var(--ok-bg); color: var(--ok); }
.result.warn { background: var(--warn-bg); color: var(--warn); }
.result.bad { background: var(--bad-bg); color: var(--bad); }
.result .state { font-size: 14px; font-weight: 700; }
.result .who { font-family: var(--serif); font-weight: 900; font-size: 34px; line-height: 1.2; color: var(--ink); overflow-wrap: anywhere; }
.result .meta { font-size: 14px; color: var(--ink); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.result .act { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
button { font-family: inherit; font-size: 14px; font-weight: 500; min-height: 40px; padding: 0 14px; border: 1px solid var(--ink); border-radius: 0; background: transparent; color: var(--ink); cursor: pointer; white-space: nowrap; }
button.big { font-size: 20px; font-weight: 700; border: 0; }
button.primary { background: var(--ink); color: var(--on-ink); }
button.danger { border-color: var(--bad); color: var(--bad); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--orange-deep); outline-offset: 2px; }
input { width: 100%; min-height: 48px; padding: 0 12px; font-family: inherit; font-size: 16px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 0; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tabs button { border-color: var(--line); color: var(--muted); }
.tabs button[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.note { font-size: 14px; color: var(--muted); margin: 0; }
.note.alert { color: var(--bad); }
ul { list-style: none; margin: 0; padding: 0; background: var(--card); }
li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
li:last-child { border-bottom: 0; }
li .info { flex: 1; min-width: 0; }
li .name { font-weight: 700; overflow-wrap: anywhere; }
li .sub { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
li.done .name { color: var(--ok); }
textarea { width: 100%; min-height: 120px; font-size: 13px; background: var(--card); border: 1px solid var(--line); color: var(--ink); }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="event">11/6（五）13:00–16:00｜肝新 YOUNG LIVERS</div>
    <h1>現場報到</h1>
    <div class="count" id="countRow" hidden><b id="nDone">0</b><span id="nTotal"></span></div>
    <div class="bar" id="barRow" hidden><i id="barFill"></i></div>
  </div>
</header>
<main>
  <div class="wrap">
    <form class="lock" id="lock">
      <label for="pass">輸入通行碼</label>
      <input id="pass" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="big" type="submit">開啟名單</button>
      <p class="note" id="lockMsg"></p>
    </form>

    <div id="app" hidden style="display:flex;flex-direction:column;gap:14px">
      <button class="big" id="startBtn" type="button">開啟相機掃描</button>
      <div class="camera" id="camera" hidden>
        <video id="video" playsinline muted></video>
        <div class="frame"></div>
      </div>
      <div id="result" class="result" aria-live="polite" hidden></div>
      <p id="status" class="note" hidden></p>
      <input id="search" type="search" placeholder="沒帶票？打名字或票號找人" aria-label="搜尋名字或票號" autocomplete="off">
      <div class="tabs" role="group" aria-label="篩選名單">
        <button id="tabAll" type="button" aria-pressed="true">全部</button>
        <button id="tabTodo" type="button" aria-pressed="false">還沒到</button>
        <button id="tabDone" type="button" aria-pressed="false">已報到</button>
      </div>
      <ul id="list"></ul>
      <button id="copyBtn" type="button">複製報到結果</button>
      <textarea id="copyBox" aria-label="報到結果" readonly hidden></textarea>
      <p class="note">報到紀錄只存在這支手機。全程用同一支手機、同一個瀏覽器，不要開無痕模式。</p>
    </div>
  </div>
</main>

<script src="jsQR.js"></script>
<script>
const PAYLOAD = {"iter":300000,"salt":"sY2vKm5oTfAuT1jgGQxp9g==","iv":"k6D7m+kWZdLYZRw6","ct":"Rkw2nxADEzz2GrrB6a2HCh7GSMSpur3PmGK1ro9vWvmOKaSrUmHdS2pqBR1WIDUFLMd5A125SoTpxu+Vr71NG36+xypEQwLBFGk2suGDgxtyKW+mBJqKFWwXTbDB4+NhR5Pzvby+d2aUC8YsqwDjwx2CyB5+w5XHXJtzDMR5qTVx+l+vRmXtxC1bYDfoqSom3KMPgUm5jGSmmajzBosMgKb+7CoWshbiW3u1G9Ovb/xX1Zf0ruiyg9XZBRX7a7P3R23etx8SHjI+A3PxUC/fYoVkrsdK31jQyxfvoNnoCbDFKocpE4P/JkCqOfgcleD4fDvqhl01zQZCeTIq/k1WL4dznosSPWDqbH3qFqn00t74ncqXdFZq2zo+W7/lV7HqYYvMgXm1q9jJCQwFtontAStp8NlBXYrYJZnmSQ5ekohGpbYyZk3BMQp7aq1P/BaCssB68Bohy05TIlLwdvTh2gB4s70dRxWUGx9XzXFyjyK/QeGxC5T4nRj8bWiWjMEo5ULJYOfUnsjpuDfZbEVnVcuo7h78hNg+CeBaJ71ZoXuO6CtrxwCeU5wclosq7DFYt/1/eCFx68poyNjb/mGScTGT9bWBx7+rbZMNfKQoFN8MK74nGblEaZKz43D0fYlJKBble2yjVBCEq27OPJs9pqlVjRfo7HOb2+x7z5c0JSJ6wR6/YoJ4ilB8/5JxSFOTsWNPjQ+JPl9lXdJnwI72xDdP27+HhHCz4U9pOCwtSRPYTVojZRiX6G2ZDGWGuJ7CqkCjbkzaDoZHoGpTuvPBXNh/b5W64d6Xls1RZ845FJDRtJaOmnn76nDqvO9cnDDIGAJgK9KuwlAgpND2S6jXo2rT5dYWVIh8Fb31fh95XuYjjALAEHLzlVJ2+P1s9Kc7LBBx8IIR3y3eEQ4zZHtGKs+Hbp7+e/UuL+7Kyb1wnqJPTfJR2h4rN+zSadGeioLtZOimG6U9dFhPv7zRRA08HmEY4csPA1wKM4EuZUOavA60RZL42u1soJOfiftqezRbwqRb4P8IFW8etTM8b4UrtUFLFl/vbhjvlhePoi4Wmq2fz5JZtFxP46PPxWQeEBoSvIusuBk0pSDIvDQ4ncU56FkZzFdc8gvgMPK0HywBS/MVzOFUG2WwS3BmhmP6beugDORwChH54YUIw20TposXMUyLObS5uDRimHR4+GorqKQOvpLdew8y3JvCD8uP+mcPxfpuwEpKWTduYDr8MKZu9U2Qxps4f/XjJJxZaqUc0Qi5b2b6d3wcgnID7UyjXr0ZRFpRY4ruIksR+MIHSAsokFxKG7j2TMW6tIyjTTatQeEizC3wp9n+ZZYU8LD/wpNYZgZpD8mxrHlUl3vfNxNkzSOtKdQa93MuarDWhpPrybiG2/LKInGGapSf0yTfmOKbkYY0oL3ckx/C1MN6SWvepItk82/saGGf+CxPQpAQyymDRxt3w3Kfy651NrJeARkrjAGe4JsRnEmm4ZQsEmBZBgFpoIu8gnwyFLoPCADWV8uc5e58p3WCAfEXNEHoIQUKqkIQme3bNnL1MHQI3R4g91OY8stkoOoH7xQPfdZJ/ykMhCDcHOgD8STQ/AWGa1kVX5SlIIm3TV+/70J+33aRm/ZV43xu8qWOWLOnAMhXHUUlC0oOPY61GHiSEy0NTrNC5tWAuUvBPqRNWcvA3Bt7cSbAxUz07ybZbeMeVelX44EvNhshDV6oo+WK"};
const ROSTER_KEY = "fd1106-roster-" + PAYLOAD.salt.slice(0, 8);
const STATE_KEY = "fd1106-checkins";
const $ = (id) => document.getElementById(id);

let roster = [];
let checks = {};   // no -> { at, name?, extra? }
let filter = "all";
let armedCancel = null;
let lastResult = null;
let stream = null;
let audio = null;
let pausedUntil = 0;
let lastCode = "";
let lastCodeAt = 0;

const load = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const clock = (iso) => new Date(iso).toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Taipei" });

async function unlock(pass) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

function people() {
  const extras = Object.keys(checks).filter((no) => checks[no].extra).map((no) => ({ no, name: checks[no].name }));
  return roster.concat(extras);
}
const findNo = (no) => people().find((t) => t.no === no);

function persist() {
  if (!save(STATE_KEY, checks)) setStatus("這支手機存不了紀錄，請關掉無痕模式。", true);
}

function setStatus(text, alert) {
  $("status").textContent = text;
  $("status").className = alert ? "note alert" : "note";
  $("status").hidden = !text;
}

function renderCount() {
  const all = people();
  const done = all.filter((t) => checks[t.no]).length;
  $("nDone").textContent = done;
  $("nTotal").textContent = "／" + all.length + " 人已報到";
  $("barFill").style.width = all.length ? (done / all.length) * 100 + "%" : "0";
}

function cancelButton(no) {
  const b = document.createElement("button");
  b.type = "button";
  const armed = armedCancel === no;
  b.textContent = armed ? "確定取消？" : "取消報到";
  b.className = armed ? "danger" : "";
  b.onclick = () => {
    if (armedCancel !== no) { armedCancel = no; render(); return; }
    armedCancel = null;
    delete checks[no];
    persist();
    if (lastResult && lastResult.no === no) lastResult = null;
    render();
  };
  return b;
}

function renderList() {
  const q = $("search").value.trim().toLowerCase();
  const rows = people().filter((t) => {
    if (filter === "todo" && checks[t.no]) return false;
    if (filter === "done" && !checks[t.no]) return false;
    return !q || t.name.toLowerCase().includes(q) || t.no.toLowerCase().includes(q);
  });
  const ul = $("list");
  ul.textContent = "";
  ul.hidden = !rows.length;
  rows.forEach((t) => {
    const c = checks[t.no];
    const li = document.createElement("li");
    li.className = c ? "done" : "";
    const info = document.createElement("div");
    info.className = "info";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = t.name;
    const sub = document.createElement("div");
    sub.className = "sub";
    sub.textContent = t.no + (c ? "｜" + clock(c.at) + " 報到" : "");
    info.append(name, sub);
    li.append(info);
    if (c) {
      li.append(cancelButton(t.no));
    } else {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "primary";
      b.textContent = "報到";
      b.onclick = () => checkIn(t.no);
      li.append(b);
    }
    ul.append(li);
  });
}

function renderResult() {
  const box = $("result");
  box.textContent = "";
  box.hidden = !lastResult;
  if (!lastResult) return;
  const r = lastResult;
  box.className = "result " + r.kind;
  const add = (cls, text) => {
    if (!text) return;
    const el = document.createElement("div");
    el.className = cls;
    el.textContent = text;
    box.append(el);
  };
  add("state", r.state);
  add("who", r.who);
  add("meta", r.meta);
  const act = document.createElement("div");
  act.className = "act";
  if (r.no && checks[r.no]) act.append(cancelButton(r.no));
  if (r.extra) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "primary";
    b.textContent = "仍然報到";
    b.onclick = () => {
      checks[r.extra.no] = { at: new Date().toISOString(), name: r.extra.name, extra: true };
      persist();
      lastResult = { kind: "ok", state: "報到成功（名單外）", who: r.extra.name, meta: r.extra.no, no: r.extra.no };
      render();
    };
    act.append(b);
  }
  if (act.children.length) box.append(act);
}

function render() {
  renderCount();
  renderResult();
  renderList();
}

function beep(ok) {
  if (navigator.vibrate) navigator.vibrate(ok ? 80 : [80, 60, 80]);
  if (!audio) return;
  const o = audio.createOscillator();
  const g = audio.createGain();
  o.frequency.value = ok ? 1200 : 300;
  g.gain.value = 0.15;
  o.connect(g).connect(audio.destination);
  o.start();
  o.stop(audio.currentTime + (ok ? 0.12 : 0.3));
}

function checkIn(no) {
  const t = findNo(no);
  if (!t) return;
  $("search").value = "";
  if (checks[no]) {
    lastResult = { kind: "warn", state: "這張票已經報到過", who: t.name, meta: no + "｜" + clock(checks[no].at) + " 報到", no };
    beep(false);
  } else {
    checks[no] = { at: new Date().toISOString() };
    persist();
    lastResult = { kind: "ok", state: "報到成功", who: t.name, meta: no, no };
    beep(true);
  }
  render();
}

function handleCode(raw) {
  const text = raw.replace(/^﻿/, "");
  const m = text.match(/^(FD\d{4}-\d{3})\|(.+)$/);
  if (m && findNo(m[1])) { checkIn(m[1]); return; }
  lastResult = m
    ? { kind: "bad", state: "這張票不在名單裡", who: m[2], meta: m[1], extra: { no: m[1], name: m[2] } }
    : { kind: "bad", state: "這不是聚會票券", meta: text.slice(0, 60) };
  beep(false);
  render();
}

function scanLoop() {
  if (!stream) return;
  const video = $("video");
  const now = Date.now();
  if (now >= pausedUntil && video.readyState >= 2 && video.videoWidth) {
    const canvas = scanLoop.canvas || (scanLoop.canvas = document.createElement("canvas"));
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const scale = Math.min(1, 800 / Math.max(video.videoWidth, video.videoHeight));
    canvas.width = Math.round(video.videoWidth * scale);
    canvas.height = Math.round(video.videoHeight * scale);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(img.data, img.width, img.height, { inversionAttempts: "dontInvert" });
    if (code && code.data) {
      // A ticket held in front of the camera counts once; it must leave the frame for 4s to scan again.
      const repeat = code.data === lastCode && now - lastCodeAt < 4000;
      lastCode = code.data;
      lastCodeAt = now;
      if (!repeat) {
        pausedUntil = now + 1200;
        handleCode(code.data);
      }
    }
  }
  setTimeout(scanLoop, 150);
}

async function startCamera() {
  setStatus("");
  try {
    if (!audio && window.AudioContext) audio = new AudioContext();
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } } });
    const video = $("video");
    video.srcObject = stream;
    $("camera").hidden = false;
    $("startBtn").textContent = "關閉相機";
    await video.play();
    scanLoop();
  } catch (e) {
    stopCamera();
    const denied = e && e.name === "NotAllowedError";
    setStatus(denied ? "相機被拒絕了。請到瀏覽器的網站設定允許相機，再重新整理。" : "開不了相機。請用 Safari 或 Chrome 開這頁，不要在 LINE 或 IG 裡開。", true);
  }
}

function stopCamera() {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = null;
  $("video").srcObject = null;
  $("camera").hidden = true;
  $("startBtn").textContent = "開啟相機掃描";
}

function resultText() {
  return ["票號\t名字\t報到時間"].concat(
    people().filter((t) => checks[t.no]).map((t) => t.no + "\t" + t.name + "\t" + clock(checks[t.no].at))
  ).join("\n");
}

function openApp() {
  checks = load(STATE_KEY) || {};
  $("lock").hidden = true;
  $("app").hidden = false;
  $("countRow").hidden = false;
  $("barRow").hidden = false;
  render();
}

$("lock").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("lockMsg").textContent = "解開中";
  try {
    roster = await unlock($("pass").value.trim());
    save(ROSTER_KEY, roster);
    $("lockMsg").textContent = "";
    openApp();
  } catch (err) {
    $("lockMsg").textContent = "通行碼不對，再試一次。";
  }
});

$("startBtn").onclick = () => (stream ? stopCamera() : startCamera());
$("search").addEventListener("input", renderList);
[["tabAll", "all"], ["tabTodo", "todo"], ["tabDone", "done"]].forEach(([id, value]) => {
  $(id).onclick = () => {
    filter = value;
    ["tabAll", "tabTodo", "tabDone"].forEach((x) => $(x).setAttribute("aria-pressed", x === id));
    renderList();
  };
});
$("copyBtn").onclick = async () => {
  const text = resultText();
  try {
    await navigator.clipboard.writeText(text);
    $("copyBtn").textContent = "已複製";
    setTimeout(() => { $("copyBtn").textContent = "複製報到結果"; }, 1500);
  } catch (e) {
    $("copyBox").value = text;
    $("copyBox").hidden = false;
    $("copyBox").select();
  }
};
document.addEventListener("visibilitychange", () => { if (document.hidden && stream) stopCamera(); });

const cached = load(ROSTER_KEY);
if (cached) { roster = cached; openApp(); }
</script>
</body>
</html>

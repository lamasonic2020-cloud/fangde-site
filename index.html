document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"db55f231-6831-4172-a0fc-41c9d9927e35\"><\u002Fscript>\n\n\n\n\n\n\n\n\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"anonymous\">\n<script>(function(){var l=document.createElement(\"link\");l.rel=\"stylesheet\";l.href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&family=Caveat:wght@500;600&display=swap\";document.head.appendChild(l);})();<\u002Fscript>\n<style>\nhtml,body{margin:0;padding:0;background:#dedddb;color:#1a1918;font-family:'Noto Sans TC',system-ui,sans-serif;-webkit-font-smoothing:antialiased}\na{color:#1a1918;text-decoration:none}\na:hover{color:#000000}\n::selection{background:#1a1918;color:#dedddb}\n@keyframes dvRise{from{opacity:0;transform:translateY(48px)}to{opacity:1;transform:translateY(0)}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background:#dedddb;color:#1a1918;min-height:100vh;font-family:'Noto Sans TC',system-ui,sans-serif;line-height:1.75;overflow-x:hidden\">\n\n  <!-- ─── 開場動畫 ─── -->\n  <sc-if value=\"{{ introVisible }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;z-index:999;background:#dedddb;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:transform 0.75s cubic-bezier(0.76,0,0.24,1);transform:{{ introWrapT }};will-change:transform\">\n      <div style=\"font-family:'Noto Serif TC',serif;font-weight:900;font-size:clamp(56px,10vw,104px);letter-spacing:0.14em;color:#1a1918;line-height:1.1;transition:opacity 0.8s ease,transform 0.8s cubic-bezier(0.22,1,0.36,1);opacity:{{ introTextO }};transform:{{ introTextT }}\">訪得<\u002Fdiv>\n      <div style=\"height:10px;background:#e58a4b;transition:width 0.7s cubic-bezier(0.76,0,0.24,1) 0.35s;width:{{ introBarW }}\"><\u002Fdiv>\n      <div style=\"font-family:'Caveat',cursive;font-size:clamp(20px,3vw,28px);color:#e58a4b;transition:opacity 0.6s ease 0.55s;opacity:{{ introTextO }}\">Founder<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ─── NAV ─── -->\n  <header style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px clamp(20px,5vw,64px);border-bottom:1px solid rgba(0,0,0,0.14);background:#e7e6e4\">\n    <div style=\"display:flex;align-items:center;gap:14px\">\n      <img src=\"e9415681-abf5-44c6-9f2f-ae502af4862a\" alt=\"訪得 logo\" style=\"width:44px;height:44px;display:block;flex:none\">\n      <div style=\"display:flex;flex-direction:column\">\n        <span style=\"font-family:'Noto Serif TC',serif;font-weight:900;font-size:17px;letter-spacing:0.08em;line-height:1.3\">訪得<\u002Fspan>\n        <span style=\"font-size:11px;color:#7b7a76;letter-spacing:0.12em\">內容私域｜線上事業顧問<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <a href=\"{{ ctaUrl }}\" style=\"flex:none;background:#1a1918;color:#f2f1ee;font-size:13px;font-weight:700;letter-spacing:0.08em;padding:10px 20px;border-radius:2px\" style-hover=\"background:#000000\">申請諮詢<\u002Fa>\n  <\u002Fheader>\n\n  <!-- ─── 01 HERO ─── -->\n  <section data-screen-label=\"Hero\" style=\"padding:clamp(72px,10vw,140px) clamp(20px,5vw,64px) clamp(64px,8vw,120px);border-bottom:1px solid rgba(0,0,0,0.14);background:#e7e6e4\">\n    <div style=\"max-width:1160px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:clamp(40px,6vw,88px);align-items:center\">\n      <div>\n        <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:28px\">\n          \n        <\u002Fdiv>\n        <h1 style=\"font-family:'Noto Serif TC',serif;font-weight:900;font-size:clamp(30px,4vw,54px);line-height:1.36;margin:0 0 28px;letter-spacing:0.01em;color:#23201E\"><span style=\"white-space:nowrap\">把你的專業<\u002Fspan><br><span style=\"white-space:nowrap\">做成一套<\u002Fspan><br><span style=\"white-space:nowrap;color:#faf9f7;background:linear-gradient(100deg,rgba(229,138,75,0) 0.5%,#e58a4b 3%,#e58a4b 97.5%,rgba(229,138,75,0) 99%);padding:2px 12px 4px;margin-left:-4px\">能持續獲客的<\u002Fspan><br><span style=\"white-space:nowrap;color:#faf9f7;background:linear-gradient(100deg,rgba(229,138,75,0) 0.5%,#e58a4b 3%,#e58a4b 97.5%,rgba(229,138,75,0) 99%);padding:2px 12px 4px;margin-left:-4px\">線上事業<\u002Fspan><\u002Fh1>\n        <p style=\"font-size:clamp(15px,1.3vw,17px);color:#5c5b57;max-width:34em;margin:0 0 40px\">我協助有專業、有服務、有內容的人，用內容吸引精準客戶，導流到自己的私域，再透過課程、社群、顧問或服務方案完成變現。平台不設限，我主要以 Skool 交付。<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:14px;align-items:flex-start\">\n          <a href=\"{{ ctaUrl }}\" style=\"background:#1a1918;color:#f2f1ee;font-size:16px;font-weight:700;letter-spacing:0.06em;padding:16px 36px;border-radius:2px\" style-hover=\"background:#000000\">申請 1 對 1 路線診斷<\u002Fa>\n          <span style=\"font-size:12.5px;color:#8b8a86;letter-spacing:0.05em\">採申請制｜先看你的現況，再判斷是否適合安排諮詢<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#f0efed;border:1px solid rgba(0,0,0,0.12);border-radius:4px;padding:clamp(24px,3vw,36px);display:flex;flex-direction:column;box-shadow:0 2px 16px rgba(0,0,0,0.06)\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px\">\n          <span style=\"font-size:11px;letter-spacing:0.24em;color:#8b8a86\">線上事業路徑<\u002Fspan>\n          <span style=\"font-family:'Caveat',cursive;font-size:19px;color:#e58a4b\">the path<\u002Fspan>\n        <\u002Fdiv>\n        <sc-for list=\"{{ pathSteps }}\" as=\"step\" hint-placeholder-count=\"5\">\n          <div style=\"display:flex;gap:18px;padding:16px 0;border-bottom:1px solid rgba(0,0,0,0.10)\">\n            <span style=\"font-family:'Noto Serif TC',serif;font-size:13px;color:#e58a4b;padding-top:3px;flex:none\">{{ step.num }}<\u002Fspan>\n            <div>\n              <div style=\"font-size:15px;font-weight:700;letter-spacing:0.04em\">{{ step.title }}<\u002Fdiv>\n              <div style=\"font-size:13px;color:#7b7a76;margin-top:2px\">{{ step.desc }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ─── 02 信任列 ─── -->\n  <section data-screen-label=\"信任列\" style=\"padding:26px clamp(20px,5vw,64px);border-bottom:1px solid rgba(0,0,0,0.14);background:#d5d4d1\">\n    <div style=\"max-width:1160px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:18px clamp(24px,4vw,56px)\">\n      <span style=\"font-size:12.5px;color:#7b7a76;letter-spacing:0.08em\">已協助不同類型的專業者整理內容與線上變現路徑<\u002Fspan>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px clamp(20px,3vw,44px)\">\n        <span style=\"font-size:13.5px;color:#3a3936;font-weight:500;letter-spacing:0.06em\">凡氏可行｜關係內容<\u002Fspan>\n        <span style=\"font-size:13.5px;color:#3a3936;font-weight:500;letter-spacing:0.06em\">Miranda｜運動按摩<\u002Fspan>\n        <span style=\"font-size:13.5px;color:#3a3936;font-weight:500;letter-spacing:0.06em\">唐芯｜表達訓練<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ─── 03 痛點 ─── -->\n  <section data-screen-label=\"痛點區\" style=\"padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px);border-bottom:1px solid rgba(0,0,0,0.14);background:#dedddb\">\n    <div style=\"max-width:1160px;margin:0 auto;animation:dvRise 0.9s cubic-bezier(0.22,1,0.36,1) both;animation-timeline:view();animation-range:entry 0% entry 30%\">\n      <h2 style=\"font-family:'Noto Serif TC',serif;font-weight:900;font-size:clamp(26px,3.4vw,42px);line-height:1.4;margin:0 0 18px\">很多人有在做內容，<br>卻一直沒有做成一門生意<\u002Fh2>\n      <p style=\"font-size:15.5px;color:#5c5b57;max-width:38em;margin:0 0 clamp(44px,5vw,64px)\">你可能有流量、有專業，甚至已經有人私訊你，但每一個環節都沒有真正接起來。<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1px;background:rgba(0,0,0,0.14);border:1px solid rgba(0,0,0,0.14)\">\n        <sc-for list=\"{{ pains }}\" as=\"p\" hint-placeholder-count=\"6\">\n          <div style=\"background:#e7e6e4;padding:clamp(24px,2.6vw,34px)\">\n            <div style=\"font-size:11px;letter-spacing:0.22em;color:#e58a4b;font-weight:700;margin-bottom:14px\">{{ p.tag }}<\u002Fdiv>\n            <div style=\"font-size:17px;font-weight:700;line-height:1.55;margin-bottom:10px\">{{ p.title }}<\u002Fdiv>\n            <div style=\"font-size:13.5px;color:#6e6d69;line-height:1.8\">{{ p.desc }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"font-family:'Noto Serif TC',serif;font-weight:700;font-size:clamp(20px,2.6vw,32px);line-height:1.6;text-align:center;max-width:24em;margin:clamp(56px,7vw,88px) auto 0\">真正卡住你的地方，通常不是不夠努力<br><span style=\"color:#8b8a86\">是內容、私域、產品與交付之間，沒有一條清楚的路<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ─── 05 方法論 ─── -->\n  <section data-screen-label=\"方法論\" style=\"padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px);border-bottom:1px solid rgba(0,0,0,0.14);background:#d5d4d1\">\n    <div style=\"max-width:1160px;margin:0 auto;animation:dvRise 0.9s cubic-bezier(0.22,1,0.36,1) both;animation-timeline:view();animation-range:entry 0% entry 30%\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:20px\">\n        <span style=\"font-size:12px;letter-spacing:0.28em;color:#7b7a76\">方法論<\u002Fspan>\n        <span style=\"font-family:'Caveat',cursive;font-size:20px;color:#e58a4b\">step by step<\u002Fspan>\n      <\u002Fdiv>\n      <h2 style=\"font-family:'Noto Serif TC',serif;font-weight:900;font-size:clamp(26px,3.4vw,42px);line-height:1.4;margin:0 0 18px\">內容私域變現路徑<\u002Fh2>\n      <p style=\"font-size:15.5px;color:#5c5b57;max-width:36em;margin:0 0 clamp(44px,5vw,64px)\">讓陌生人從第一次看到你，一路走到加入社群、購買產品與持續升級。<\u002Fp>\n      <div style=\"display:flex;flex-direction:column\">\n        <sc-for list=\"{{ methods }}\" as=\"m\" hint-placeholder-count=\"5\">\n          <div style=\"display:grid;grid-template-columns:minmax(90px,140px) 1fr;gap:clamp(16px,3vw,40px);padding:clamp(22px,2.6vw,32px) 0;border-top:1px solid rgba(0,0,0,0.16);align-items:baseline\">\n            <span style=\"font-family:'Noto Serif TC',serif;font-size:clamp(13px,1.2vw,15px);letter-spacing:0.14em;color:#e58a4b;font-weight:700\">STEP {{ m.num }}<\u002Fspan>\n            <div>\n              <div style=\"font-size:clamp(18px,1.8vw,22px);font-weight:700;margin-bottom:6px\">{{ m.title }}<\u002Fdiv>\n              <div style=\"font-size:14px;color:#6e6d69\">{{ m.desc }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ─── 06 諮詢會處理什麼 ─── -->\n  <section data-screen-label=\"諮詢內容\" style=\"padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px);border-bottom:1px solid rgba(0,0,0,0.14);background:#dedddb\">\n    <div style=\"max-width:1160px;margin:0 auto;animation:dvRise 0.9s cubic-bezier(0.22,1,0.36,1) both;animation-timeline:view();animation-range:entry 0% entry 30%\">\n      <h2 style=\"font-family:'Noto Serif TC',serif;font-weight:900;font-size:clamp(26px,3.4vw,42px);line-height:1.4;margin:0 0 18px\">一場諮詢，<br>先把你最重要的變現路徑排出來<\u002Fh2>\n      <p style=\"font-size:15.5px;color:#5c5b57;max-width:38em;margin:0 0 clamp(44px,5vw,64px)\">不會要求你一次把所有平台做好，我會依照你現在的資源、產品與受眾找出優先順序。<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:clamp(24px,3vw,40px);align-items:stretch\">\n        <div style=\"background:#1a1918;color:#f2f1ee;border-radius:4px;padding:clamp(28px,3vw,40px)\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px\">\n            <span style=\"font-size:11px;letter-spacing:0.24em;color:#8b8a86\">主要服務<\u002Fspan>\n            <span style=\"font-family:'Caveat',cursive;font-size:19px;color:#e58a4b\">1 on 1<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:'Noto Serif TC',serif;font-weight:900;font-size:clamp(22px,2.4vw,30px);margin-bottom:12px\">1 對 1 路線診斷<\u002Fdiv>\n          <p style=\"font-size:14px;color:#a3a29d;margin:0 0 24px\">依照你的現況，釐清下面六個核心環節。<\u002Fp>\n          <div style=\"display:flex;flex-direction:column\">\n            <sc-for list=\"{{ diagnosisItems }}\" as=\"d\" hint-placeholder-count=\"6\">\n              <div style=\"display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid rgba(255,255,255,0.14);font-size:14.5px\">\n                <span style=\"width:5px;height:5px;background:#e58a4b;flex:none;display:inline-block;transform:translateY(-2px)\"><\u002Fspan>\n                <span>{{ d }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:1px;background:rgba(0,0,0,0.14);border:1px solid rgba(0,0,0,0.14);border-radius:4px;overflow:hidden\">\n          <div style=\"background:#e7e6e4;padding:18px clamp(24px,3vw,32px) 12px\">\n            <div style=\"font-size:11px;letter-spacing:0.24em;color:#7b7a76\">你會帶走什麼<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ takeaways }}\" as=\"t\" hint-placeholder-count=\"3\">\n            <div style=\"background:#e7e6e4;padding:clamp(20px,2.4vw,26px) clamp(24px,3vw,32px);flex:1\">\n              <div style=\"font-size:16px;font-weight:700;margin-bottom:6px\">{{ t.title }}<\u002Fdiv>\n              <div style=\"font-size:13.5px;color:#6e6d69;line-height:1.8\">{{ t.desc }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ─── 合作方案 ─── -->\n  <section data-screen-label=\"合作方案\" style=\"padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px);border-bottom:1px solid rgba(0,0,0,0.14);background:#e7e6e4\">\n    <div style=\"max-width:1160px;margin:0 auto;animation:dvRise 0.9s cubic-bezier(0.22,1,0.36,1) both;animation-timeline:view();animation-range:entry 0% entry 30%\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:20px\">\n        <span style=\"font-size:12px;letter-spacing:0.28em;color:#7b7a76\">合作方案<\u002Fspan>\n        <span style=\"font-family:'Caveat',cursive;font-size:20px;color:#e58a4b\">the real work<\u002Fspan>\n      <\u002Fdiv>\n      <h2 style=\"font-family:'Noto Serif TC',serif;font-weight:900;font-size:clamp(26px,3.4vw,42px);line-height:1.4;margin:0 0 18px\">1 對 1 深度陪跑<\u002Fh2>\n      <p style=\"font-size:15.5px;color:#5c5b57;max-width:38em;margin:0 0 clamp(44px,5vw,64px)\">診斷之後，雙方確認適合，我們一起把整條路做出來。<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:clamp(24px,3vw,40px);align-items:stretch\">\n        <div style=\"background:#1a1918;color:#f2f1ee;border-radius:4px;padding:clamp(28px,3.4vw,44px);display:flex;flex-direction:column\">\n          <div style=\"font-size:12px;letter-spacing:0.24em;color:#8b8a86;margin-bottom:18px\">90 天，我會直接跟你一起動手完成<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;flex:1\">\n            <sc-for list=\"{{ programItems }}\" as=\"i\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;gap:14px;align-items:baseline;padding:12px 0;border-top:1px solid rgba(255,255,255,0.14);font-size:15px;font-weight:700\">\n                <span style=\"flex:none;color:#e58a4b\">＋<\u002Fspan>\n                <span>{{ i }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <p style=\"font-family:'Noto Serif TC',serif;font-weight:700;font-size:clamp(17px,1.7vw,21px);line-height:1.7;margin:26px 0 0;border-top:1px solid rgba(255,255,255,0.14);padding-top:22px\">你出專業，我出系統<br><span style=\"color:#a3a29d\">做完，你手上會有一套自己跑得動的線上事業<\u002Fspan><\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:clamp(20px,2.4vw,28px);justify-content:center\">\n          <div style=\"border-top:2px solid #1a1918;padding-top:20px\">\n            <div style=\"font-size:12px;letter-spacing:0.2em;color:#e58a4b;font-weight:700;margin-bottom:10px\">採申請制<\u002Fdiv>\n            <div style=\"font-size:15px;color:#3a3936;line-height:1.9\">名額有限。先申請 1 對 1 路線診斷，我會先看你的現況，確認這套方法幫得上你，才會談合作。<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:2px solid #1a1918;padding-top:20px\">\n            <div style=\"font-size:12px;letter-spacing:0.2em;color:#e58a4b;font-weight:700;margin-bottom:10px\">費用與細節<\u002Fdiv>\n            <div style=\"font-size:15px;color:#3a3936;line-height:1.9\">一對一深度陪跑方案：新台幣 25 萬元。雙方會先透過診斷確認是否適合合作；不適合的，我會直接告訴你現階段該做什麼，不會硬推。<\u002Fdiv>\n          <\u002Fdiv>\n          <a href=\"{{ ctaUrl }}\" style=\"align-self:flex-start;background:#1a1918;color:#f2f1ee;font-size:15px;font-weight:700;letter-spacing:0.06em;padding:15px 34px;border-radius:2px\" style-hover=\"background:#000000\">申請 1 對 1 路線診斷<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ─── 08 案例 ─── -->\n  <section data-screen-label=\"案例區\" style=\"padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px);border-bottom:1px solid rgba(0,0,0,0.14);background:#dedddb\">\n    <div style=\"max-width:1160px;margin:0 auto;animation:dvRise 0.9s cubic-bezier(0.22,1,0.36,1) both;animation-timeline:view();animation-range:entry 0% entry 30%\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:20px\">\n        <span style=\"font-size:12px;letter-spacing:0.28em;color:#7b7a76\">合作案例<\u002Fspan>\n        <span style=\"font-family:'Caveat',cursive;font-size:20px;color:#e58a4b\">real people<\u002Fspan>\n      <\u002Fdiv>\n      <h2 style=\"font-family:'Noto Serif TC',serif;font-weight:900;font-size:clamp(26px,3.4vw,42px);line-height:1.4;margin:0 0 18px\">不同領域，都需要把內容<br>接到一個可變現的地方<\u002Fh2>\n      <p style=\"font-size:14px;color:#8b8a86;max-width:40em;margin:0 0 clamp(44px,5vw,64px)\">三位合作者，三種不同的起點，走到同一個結果：一份能持續變現的線上事業。<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:clamp(20px,2.6vw,32px)\">\n        <sc-for list=\"{{ cases }}\" as=\"c\" hint-placeholder-count=\"3\">\n          <div style=\"background:#f0efed;border:1px solid rgba(0,0,0,0.12);border-radius:4px;overflow:hidden;display:flex;flex-direction:column\">\n            <div role=\"img\" aria-label=\"{{ c.name }} 成果截圖\" style=\"width:100%;aspect-ratio:16/9;background-color:#0d0d0c;background-image:{{ c.bgCss }};background-size:contain;background-position:center;background-repeat:no-repeat\"><\u002Fdiv>\n            <div style=\"padding:clamp(24px,2.6vw,32px);display:flex;flex-direction:column;gap:14px;flex:1\">\n              <div>\n                <div style=\"font-family:'Noto Serif TC',serif;font-weight:900;font-size:21px;margin-bottom:4px\">{{ c.name }}<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#e58a4b;font-weight:700;letter-spacing:0.08em\">{{ c.field }}<\u002Fdiv>\n              <\u002Fdiv>\n              <p style=\"font-size:14px;color:#5c5b57;line-height:1.85;margin:0;flex:1\">{{ c.desc }}<\u002Fp>\n              <div style=\"font-size:12.5px;letter-spacing:0.04em;color:#3a3936;font-weight:500;border-top:1px solid rgba(0,0,0,0.12);padding-top:14px\">{{ c.tags }}<\u002Fdiv>\n              <sc-if value=\"{{ showCaseNotes }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"font-size:12px;color:#9a9995;line-height:1.7\">{{ c.note }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <!-- 學員見證 -->\n      <div style=\"margin-top:clamp(56px,7vw,88px)\">\n        <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:14px\">\n          <span style=\"font-size:12px;letter-spacing:0.28em;color:#7b7a76\">學員見證<\u002Fspan>\n          <span style=\"font-family:'Caveat',cursive;font-size:20px;color:#e58a4b\">from MVP to money<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"font-size:14px;color:#8b8a86;max-width:40em;margin:0 0 clamp(28px,3.6vw,44px)\">用同一套方法，先做出第一版 MVP，再讓市場告訴你答案。<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:clamp(16px,2vw,24px)\">\n          <sc-for list=\"{{ testimonials }}\" as=\"t\" hint-placeholder-count=\"5\">\n            <div style=\"background:#f0efed;border:1px solid rgba(0,0,0,0.12);border-radius:4px;overflow:hidden;display:flex;flex-direction:column\">\n              <div role=\"img\" aria-label=\"{{ t.name }} 對話截圖\" style=\"width:100%;aspect-ratio:2/1;background-color:#2b2a29;background-image:{{ t.bgCss }};background-size:contain;background-position:center;background-repeat:no-repeat\">\n                \n              <\u002Fdiv>\n              <div style=\"padding:clamp(18px,2vw,24px);display:flex;flex-direction:column;gap:12px;flex:1\">\n                <p style=\"font-size:13.5px;color:#3a3936;line-height:1.85;margin:0;flex:1\">{{ t.quote }}<\u002Fp>\n                <div style=\"border-top:1px solid rgba(0,0,0,0.12);padding-top:12px\">\n                  <div style=\"font-size:13.5px;font-weight:700\">{{ t.name }}<\u002Fdiv>\n                  <div style=\"font-size:11.5px;color:#e58a4b;font-weight:700;margin-top:2px\">{{ t.result }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ─── 09 適合與不適合 ─── -->\n  <section data-screen-label=\"適合與不適合\" style=\"padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px);border-bottom:1px solid rgba(0,0,0,0.14);background:#e7e6e4\">\n    <div style=\"max-width:1160px;margin:0 auto;animation:dvRise 0.9s cubic-bezier(0.22,1,0.36,1) both;animation-timeline:view();animation-range:entry 0% entry 30%\">\n      <h2 style=\"font-family:'Noto Serif TC',serif;font-weight:900;font-size:clamp(26px,3.4vw,42px);line-height:1.4;margin:0 0 clamp(44px,5vw,64px)\">先確認這場諮詢適不適合你<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(24px,3vw,40px)\">\n        <div style=\"background:#f0efed;border:1px solid #1a1918;border-radius:4px;padding:clamp(28px,3vw,40px)\">\n          <div style=\"font-size:15px;font-weight:700;letter-spacing:0.1em;margin-bottom:22px\">適合申請<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <sc-for list=\"{{ fitList }}\" as=\"f\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;gap:14px;font-size:14.5px;color:#3a3936;line-height:1.7\"><span style=\"flex:none;color:#e58a4b;font-weight:700\">＋<\u002Fspan><span>{{ f }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(0,0,0,0.14);border-radius:4px;padding:clamp(28px,3vw,40px)\">\n          <div style=\"font-size:15px;font-weight:700;letter-spacing:0.1em;margin-bottom:22px;color:#7b7a76\">目前不適合<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <sc-for list=\"{{ unfitList }}\" as=\"f\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;gap:14px;font-size:14.5px;color:#8b8a86;line-height:1.7\"><span style=\"flex:none\">－<\u002Fspan><span>{{ f }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ─── 10 申請流程 ─── -->\n  <section data-screen-label=\"申請流程\" style=\"padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px);border-bottom:1px solid rgba(0,0,0,0.14);background:#d5d4d1\">\n    <div style=\"max-width:1160px;margin:0 auto;animation:dvRise 0.9s cubic-bezier(0.22,1,0.36,1) both;animation-timeline:view();animation-range:entry 0% entry 30%\">\n      <h2 style=\"font-family:'Noto Serif TC',serif;font-weight:900;font-size:clamp(26px,3.4vw,42px);line-height:1.4;margin:0 0 18px\">先把你的現況與卡點交給我看<\u002Fh2>\n      <p style=\"font-size:15px;color:#5c5b57;max-width:40em;margin:0 0 32px\">填寫申請表後，我會先判斷你目前卡在內容、私域、Offer、Skool，還是整體商業路徑。確定適合，再安排 1 對 1 諮詢。<\u002Fp>\n      <a href=\"{{ ctaUrl }}\" style=\"display:inline-block;background:#1a1918;color:#f2f1ee;font-size:15px;font-weight:700;letter-spacing:0.06em;padding:15px 34px;border-radius:2px;margin-bottom:clamp(48px,6vw,72px)\" style-hover=\"background:#000000\">填寫諮詢申請表<\u002Fa>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:clamp(24px,3vw,40px)\">\n        <sc-for list=\"{{ process }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <div style=\"border-top:2px solid #1a1918;padding-top:20px\">\n            <div style=\"font-family:'Noto Serif TC',serif;font-size:13px;color:#e58a4b;margin-bottom:10px\">{{ s.num }}<\u002Fdiv>\n            <div style=\"font-size:16px;font-weight:700;margin-bottom:8px\">{{ s.title }}<\u002Fdiv>\n            <div style=\"font-size:13.5px;color:#6e6d69;line-height:1.8\">{{ s.desc }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ─── 11 FAQ ─── -->\n  <section data-screen-label=\"FAQ\" style=\"padding:clamp(72px,9vw,128px) clamp(20px,5vw,64px);border-bottom:1px solid rgba(0,0,0,0.14);background:#dedddb\">\n    <div style=\"max-width:840px;margin:0 auto;animation:dvRise 0.9s cubic-bezier(0.22,1,0.36,1) both;animation-timeline:view();animation-range:entry 0% entry 30%\">\n      <h2 style=\"font-family:'Noto Serif TC',serif;font-weight:900;font-size:clamp(26px,3.4vw,42px);margin:0 0 clamp(40px,5vw,56px)\">常見問題<\u002Fh2>\n      <div style=\"display:flex;flex-direction:column\">\n        <sc-for list=\"{{ faqs }}\" as=\"q\" hint-placeholder-count=\"4\">\n          <div style=\"border-top:1px solid rgba(0,0,0,0.16)\">\n            <button sc-camel-on-click=\"{{ q.toggle }}\" style=\"all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:20px;width:100%;padding:22px 4px;cursor:pointer;font-size:16px;font-weight:700;line-height:1.6;color:#1a1918;min-height:44px\" style-hover=\"color:#000000\">\n              <span>{{ q.q }}<\u002Fspan>\n              <span style=\"flex:none;font-size:18px;color:#e58a4b;font-weight:300\">{{ q.icon }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ q.open }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"font-size:14.5px;color:#5c5b57;line-height:1.9;margin:0;padding:0 4px 26px;max-width:44em\">{{ q.a }}<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ─── 12 最終 CTA ─── -->\n  <section data-screen-label=\"最終CTA\" style=\"padding:clamp(96px,12vw,160px) clamp(20px,5vw,64px) clamp(72px,9vw,120px);text-align:center;background:#1a1918;color:#f2f1ee\">\n    <div style=\"max-width:820px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:28px\">\n      <span style=\"font-family:'Caveat',cursive;font-size:24px;color:#e58a4b\">last step<\u002Fspan>\n      <h2 style=\"font-family:'Noto Serif TC',serif;font-weight:900;font-size:clamp(28px,4vw,50px);line-height:1.45;margin:0\">不要再讓內容停在觀看數<br>把它接到你的私域與線上事業<\u002Fh2>\n      <p style=\"font-size:15.5px;color:#a3a29d;max-width:36em;margin:0\">先找出你目前最關鍵的斷點，再決定該做什麼內容、建立什麼入口，以及用什麼 Offer 變現。<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- 申請表單 -->\n    <div id=\"apply\" style=\"max-width:720px;margin:clamp(48px,6vw,72px) auto 0;background:#f0efed;color:#1a1918;border-radius:6px;padding:clamp(28px,4vw,48px);text-align:left;scroll-margin-top:24px\">\n      <sc-if value=\"{{ notSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-bottom:28px\">\n          <div style=\"font-family:'Noto Serif TC',serif;font-weight:900;font-size:clamp(20px,2.2vw,26px);margin-bottom:8px\">申請 1 對 1 路線診斷<\u002Fdiv>\n          <div style=\"font-size:13px;color:#7b7a76\">採申請制｜填寫後我會先評估你的現況，適合再安排諮詢時間。<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-bottom:18px\">\n          <label style=\"display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700\">姓名 *\n            <input type=\"text\" value=\"{{ fName }}\" sc-camel-on-change=\"{{ setName }}\" placeholder=\"怎麼稱呼你\" style=\"all:unset;box-sizing:border-box;background:#ffffff;border:1px solid rgba(0,0,0,0.18);border-radius:3px;padding:12px 14px;font-size:14.5px;font-weight:400;font-family:'Noto Sans TC',sans-serif\" style-focus=\"border:1px solid #1a1918\">\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700\">Email *\n            <input type=\"email\" value=\"{{ fEmail }}\" sc-camel-on-change=\"{{ setEmail }}\" placeholder=\"you@example.com\" style=\"all:unset;box-sizing:border-box;background:#ffffff;border:1px solid rgba(0,0,0,0.18);border-radius:3px;padding:12px 14px;font-size:14.5px;font-weight:400;font-family:'Noto Sans TC',sans-serif\" style-focus=\"border:1px solid #1a1918\">\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700\">可聯絡的 IG\n            <input type=\"text\" value=\"{{ fIg }}\" sc-camel-on-change=\"{{ setIg }}\" placeholder=\"@your_account\" style=\"all:unset;box-sizing:border-box;background:#ffffff;border:1px solid rgba(0,0,0,0.18);border-radius:3px;padding:12px 14px;font-size:14.5px;font-weight:400;font-family:'Noto Sans TC',sans-serif\" style-focus=\"border:1px solid #1a1918\">\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700\">目前的產業 *\n            <input type=\"text\" value=\"{{ fIndustry }}\" sc-camel-on-change=\"{{ setIndustry }}\" placeholder=\"例：健身教練、美業、保險、諮詢…\" style=\"all:unset;box-sizing:border-box;background:#ffffff;border:1px solid rgba(0,0,0,0.18);border-radius:3px;padding:12px 14px;font-size:14.5px;font-weight:400;font-family:'Noto Sans TC',sans-serif\" style-focus=\"border:1px solid #1a1918\">\n          <\u002Flabel>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:18px;margin-bottom:18px\">\n          <label style=\"display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700\">你目前遇到什麼問題？ *\n            <textarea value=\"{{ fProblem }}\" sc-camel-on-change=\"{{ setProblem }}\" rows=\"3\" placeholder=\"例：內容有流量但沒有名單、有服務但卡在一對一時間…\" style=\"all:unset;box-sizing:border-box;background:#ffffff;border:1px solid rgba(0,0,0,0.18);border-radius:3px;padding:12px 14px;font-size:14.5px;font-weight:400;font-family:'Noto Sans TC',sans-serif;min-height:84px;resize:vertical\" style-focus=\"border:1px solid #1a1918\"><\u002Ftextarea>\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700\">你最想達到的狀態？ *\n            <textarea value=\"{{ fGoal }}\" sc-camel-on-change=\"{{ setGoal }}\" rows=\"3\" placeholder=\"例：三個月內做出第一版方案、月營收多 10 萬、脫離時薪…\" style=\"all:unset;box-sizing:border-box;background:#ffffff;border:1px solid rgba(0,0,0,0.18);border-radius:3px;padding:12px 14px;font-size:14.5px;font-weight:400;font-family:'Noto Sans TC',sans-serif;min-height:84px;resize:vertical\" style-focus=\"border:1px solid #1a1918\"><\u002Ftextarea>\n          <\u002Flabel>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px\">\n            <label style=\"display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700\">目前事業的月營收區間 *\n              <sc-raw-select value=\"{{ fRevenue }}\" sc-camel-on-change=\"{{ setRevenue }}\" style=\"all:unset;box-sizing:border-box;background:#ffffff;border:1px solid rgba(0,0,0,0.18);border-radius:3px;padding:12px 14px;font-size:14.5px;font-weight:400;font-family:'Noto Sans TC',sans-serif;cursor:pointer\" style-focus=\"border:1px solid #1a1918\">\n                <option value=\"\">請選擇<\u002Foption>\n                <option value=\"還沒有穩定收入\">還沒有穩定收入<\u002Foption>\n                <option value=\"10 萬以下\">10 萬以下<\u002Foption>\n                <option value=\"10–30 萬\">10–30 萬<\u002Foption>\n                <option value=\"30 萬以上\">30 萬以上<\u002Foption>\n              <\u002Fsc-raw-select>\n            <\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700\">診斷後如果確認適合，你對付費陪跑的意願 *\n              <sc-raw-select value=\"{{ fWillingness }}\" sc-camel-on-change=\"{{ setWillingness }}\" style=\"all:unset;box-sizing:border-box;background:#ffffff;border:1px solid rgba(0,0,0,0.18);border-radius:3px;padding:12px 14px;font-size:14.5px;font-weight:400;font-family:'Noto Sans TC',sans-serif;cursor:pointer\" style-focus=\"border:1px solid #1a1918\">\n                <option value=\"\">請選擇<\u002Foption>\n                <option value=\"有，想了解方案\">有，想了解方案<\u002Foption>\n                <option value=\"先診斷再說\">先診斷再說<\u002Foption>\n                <option value=\"目前只想聽建議\">目前只想聽建議<\u002Foption>\n              <\u002Fsc-raw-select>\n            <\u002Flabel>\n          <\u002Fdiv>\n          <label style=\"display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700\">方便預約的時間\n            <sc-raw-select value=\"{{ fTime }}\" sc-camel-on-change=\"{{ setTime }}\" style=\"all:unset;box-sizing:border-box;background:#ffffff;border:1px solid rgba(0,0,0,0.18);border-radius:3px;padding:12px 14px;font-size:14.5px;font-weight:400;font-family:'Noto Sans TC',sans-serif;cursor:pointer\" style-focus=\"border:1px solid #1a1918\">\n              <option value=\"\">請選擇<\u002Foption>\n              <option value=\"平日白天\">平日白天<\u002Foption>\n              <option value=\"平日晚上\">平日晚上<\u002Foption>\n              <option value=\"週末白天\">週末白天<\u002Foption>\n              <option value=\"週末晚上\">週末晚上<\u002Foption>\n              <option value=\"皆可\">皆可<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Flabel>\n        <\u002Fdiv>\n        <sc-if value=\"{{ formError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:13px;color:#b4502a;margin-bottom:14px\">{{ formError }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ submitForm }}\" style=\"all:unset;box-sizing:border-box;display:block;width:100%;text-align:center;background:#1a1918;color:#f2f1ee;font-size:16px;font-weight:700;letter-spacing:0.06em;padding:16px;border-radius:3px;cursor:pointer;min-height:44px\" style-hover=\"background:#000000\">{{ submitLabel }}<\u002Fbutton>\n        <div style=\"font-size:11.5px;color:#9a9995;margin-top:12px;text-align:center\">送出後資料會直接進入我的名單，我會在 1–2 個工作天內回覆。<\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"text-align:center;padding:24px 0\">\n          <div style=\"font-family:'Caveat',cursive;font-size:26px;color:#e58a4b;margin-bottom:12px\">application received<\u002Fdiv>\n          <div style=\"font-family:'Noto Serif TC',serif;font-weight:900;font-size:24px;margin-bottom:12px\">已收到你的申請<\u002Fdiv>\n          <div style=\"font-size:14.5px;color:#5c5b57;line-height:1.9\">我會先看你的現況與卡點，確認適合後<br>以 Email 或 IG 與你聯繫，安排 1 對 1 諮詢時間。<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <p style=\"font-size:11.5px;color:#6e6d69;line-height:1.9;max-width:44em;margin:clamp(64px,8vw,96px) auto 0\">個案結果會受到領域、執行、產品、市場與既有資源影響。網站案例僅說明合作方向，不代表保證特定營收或成果。<\u002Fp>\n  <\u002Fsection>\n\n  <footer style=\"padding:28px clamp(20px,5vw,64px);background:#1a1918;border-top:1px solid rgba(255,255,255,0.12);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;font-size:12px;color:#8b8a86;letter-spacing:0.08em\">\n    <div style=\"display:flex;align-items:center;gap:10px\">\n      <img src=\"e9415681-abf5-44c6-9f2f-ae502af4862a\" alt=\"訪得 logo\" style=\"width:26px;height:26px;display:block\">\n      <span>訪得｜內容私域・線上事業顧問<\u002Fspan>\n    <\u002Fdiv>\n    <span>© 2026 訪得<\u002Fspan>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;googleFormLink&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://docs.google.com/forms/d/e/1FAIpQLScmV_drxapr13mT5OSGMCmOaJxYRk9jrd4MndxIlgGpsECl7A/viewform?usp=pp_url&amp;entry.444590261=a&amp;entry.1388999635=a&amp;entry.456363702=a&amp;entry.1859872026=a&amp;entry.2044254799=a&amp;entry.116525826=a&amp;entry.1049573809=a&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;轉換設定&quot;,&quot;description&quot;:&quot;Google 表單「預填連結」（含 7 個 entry 參數）——申請會自動寫進你的 Google 試算表&quot;},&quot;ctaUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#apply&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;轉換設定&quot;,&quot;description&quot;:&quot;CTA 按鈕連結（預設捲動到頁尾申請表單）&quot;},&quot;showCaseNotes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;內容&quot;,&quot;description&quot;:&quot;顯示案例卡片底部的補充備註&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    intro: 0,\n    openFaq: 0,\n    form: { name: \"\", email: \"\", ig: \"\", industry: \"\", problem: \"\", goal: \"\", time: \"\", revenue: \"\", willingness: \"\" },\n    submitting: false,\n    submitted: false,\n    formError: \"\"\n  };\n\n  componentDidMount() {\n    requestAnimationFrame(() => requestAnimationFrame(() => this.setState({ intro: 1 })));\n    setTimeout(() => this.setState({ intro: 2 }), 1700);\n    setTimeout(() => this.setState({ intro: 3 }), 2550);\n  }\n\n  setField(key) {\n    return (e) => {\n      const v = e.target.value;\n      this.setState(s => ({ form: { ...s.form, [key]: v }, formError: \"\" }));\n    };\n  }\n\n  async submitApplication() {\n    const f = this.state.form;\n    const R = window.__resources || {};\n    const srcUrl = (id, fb) => 'url(\"' + (R[id] || fb) + '\")';\n    if (!f.name.trim() || !f.email.trim() || !f.industry.trim() || !f.problem.trim() || !f.goal.trim() || !f.revenue || !f.willingness) {\n      this.setState({ formError: \"請填寫所有必填欄位（姓名、Email、產業、問題、想達到的狀態、月營收區間、陪跑意願）。\" });\n      return;\n    }\n    if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(f.email.trim())) {\n      this.setState({ formError: \"Email 格式看起來不正確，請再確認一次。\" });\n      return;\n    }\n    const link = this.props.googleFormLink ?? \"https://docs.google.com/forms/d/e/1FAIpQLScmV_drxapr13mT5OSGMCmOaJxYRk9jrd4MndxIlgGpsECl7A/viewform?usp=pp_url&entry.444590261=a&entry.1388999635=a&entry.456363702=a&entry.1859872026=a&entry.2044254799=a&entry.116525826=a&entry.1049573809=a\";\n    const entryIds = [...new Set((link.match(/entry\\.\\d+/g) || []))];\n    if (!link || entryIds.length < 7) {\n      this.setState({ formError: \"表單尚未串接後台：請站主在 Tweaks 面板貼上 Google 表單的預填連結（需含 7 個 entry 參數）。\" });\n      return;\n    }\n    this.setState({ submitting: true });\n    try {\n      const action = link.split(\"?\")[0].replace(/\\/(viewform|prefill).*$/, \"/formResponse\");\n      const body = new URLSearchParams();\n      const values = [f.name, f.email, f.ig, f.industry, f.problem + \"\\n\\n【月營收區間】\" + f.revenue + \"\\n【付費陪跑意願】\" + f.willingness, f.goal, f.time];\n      entryIds.slice(0, 7).forEach((id, i) => body.append(id, values[i]));\n      await fetch(action, { method: \"POST\", mode: \"no-cors\", headers: { \"Content-Type\": \"application/x-www-form-urlencoded\" }, body: body.toString() });\n      this.setState({ submitted: true, submitting: false });\n    } catch (err) {\n      this.setState({ submitting: false, formError: \"送出失敗，請稍後再試一次。\" });\n    }\n  }\n\n  renderVals() {\n    const openFaq = this.state.openFaq;\n    const f = this.state.form;\n    const R = window.__resources || {};\n    const srcUrl = (id, fb) => 'url(\"' + (R[id] || fb) + '\")';\n    const faqsData = [\n      { q: \"我還沒有 Skool，可以來諮詢嗎？\", a: \"可以。Skool 是後端承載工具，前面仍然要先釐清市場、定位、Offer 與導流方式。先把商業邏輯排好，再決定怎麼建社群。\" },\n      { q: \"我現在沒有很多粉絲，能做線上事業嗎？\", a: \"可以先從小量精準名單測試。粉絲數少不代表不能賣，關鍵在於內容有沒有打中需求，以及私域與產品是否接得住。\" },\n      { q: \"我有實體服務，也適合做嗎？\", a: \"適合。你可以先用內容吸引客戶，再依照你的能力延伸線上諮詢、課程、會員社群、培訓或高單價顧問。\" },\n      { q: \"諮詢後一定要加入合作方案嗎？\", a: \"不用。諮詢會先處理你的現況。這場診斷同時是付費陪跑的前置評估——雙方都確認適合，我才會說明合作方式與費用。\" }\n    ];\n    const intro = this.state.intro ?? 0;\n    return {\n      introVisible: intro < 3,\n      introWrapT: intro >= 2 ? \"translateY(-100%)\" : \"translateY(0)\",\n      introTextO: intro >= 1 ? 1 : 0,\n      introTextT: intro >= 1 ? \"translateY(0)\" : \"translateY(22px)\",\n      introBarW: intro >= 1 ? \"clamp(150px,26vw,270px)\" : \"0px\",\n      fName: f.name, fEmail: f.email, fIg: f.ig, fIndustry: f.industry, fProblem: f.problem, fGoal: f.goal, fTime: f.time, fRevenue: f.revenue, fWillingness: f.willingness,\n      setName: this.setField(\"name\"), setEmail: this.setField(\"email\"), setIg: this.setField(\"ig\"),\n      setIndustry: this.setField(\"industry\"), setProblem: this.setField(\"problem\"), setGoal: this.setField(\"goal\"), setTime: this.setField(\"time\"),\n      setRevenue: this.setField(\"revenue\"), setWillingness: this.setField(\"willingness\"),\n      programItems: [\n        \"定位與核心主張\",\n        \"銷售頁與成交文案\",\n        \"內容獲客與私域入口\",\n        \"Skool 課程與社群架構\",\n        \"第一波開賣與成交路徑\"\n      ],\n      submitForm: () => this.submitApplication(),\n      submitLabel: this.state.submitting ? \"送出中…\" : \"送出申請\",\n      submitted: this.state.submitted,\n      notSubmitted: !this.state.submitted,\n      formError: this.state.formError,\n      ctaUrl: this.props.ctaUrl ?? \"#apply\",\n      showCaseNotes: this.props.showCaseNotes ?? true,\n      pathSteps: [\n        { num: \"01\", title: \"內容吸引\", desc: \"讓真正有需求的人停下來看你\" },\n        { num: \"02\", title: \"私域承接\", desc: \"把流量帶進 LINE、名單或免費社群\" },\n        { num: \"03\", title: \"Offer 設計\", desc: \"把能力包裝成客戶願意購買的方案\" },\n        { num: \"04\", title: \"Skool 交付\", desc: \"用課程、社群、直播與陪跑創造成果\" },\n        { num: \"05\", title: \"持續變現\", desc: \"建立續費、升級、顧問與高單價路徑\" }\n      ],\n      pains: [\n        { tag: \"01｜內容問題\", title: \"每天都在發，客戶還是不知道你能幫他什麼\", desc: \"內容很勤勞，主題也很多，但定位太散，觀眾看完只覺得你很認真。\" },\n        { tag: \"02｜流量問題\", title: \"觸及偶爾很高，名單卻沒有留下來\", desc: \"觀眾看完影片就離開，你每個月都要重新追流量，沒有自己的名單資產。\" },\n        { tag: \"03｜私域問題\", title: \"把人拉進群組後，不知道要講什麼\", desc: \"群裡只有公告與丟連結，成員沒有留下來的理由，也沒有走向成交的安排。\" },\n        { tag: \"04｜Offer 問題\", title: \"很想做課程，卻不知道到底要賣什麼\", desc: \"想塞進所有會的東西，最後課綱很滿，客戶仍然看不懂買完會得到什麼。\" },\n        { tag: \"05｜交付問題\", title: \"一對一服務做得很累，收入仍然卡在時間\", desc: \"每個客戶都從頭講一次，你的知識沒有被整理成可重複交付的內容。\" },\n        { tag: \"06｜方向問題\", title: \"學了很多工具，整條路還是很亂\", desc: \"短影片、AI、電子報、LINE、Skool 全部都碰，卻不知道現階段哪一個最重要。\" }\n      ],\n      methods: [\n        { num: \"01\", title: \"定位與主張\", desc: \"講清楚你幫誰、解決什麼問題、為什麼值得選你。\" },\n        { num: \"02\", title: \"內容獲客\", desc: \"用痛點、故事、案例與立場吸引真正有需求的人。\" },\n        { num: \"03\", title: \"私域承接\", desc: \"設計關鍵字、名單磁鐵、LINE 或免費社群入口。\" },\n        { num: \"04\", title: \"Skool Offer\", desc: \"把課程、社群、直播、作業與顧問整理成完整方案。\" },\n        { num: \"05\", title: \"成交與續費\", desc: \"安排試用、諮詢、開賣、續訂、升級與高單價服務。\" }\n      ],\n      diagnosisItems: [\n        \"目標客群與核心痛點\",\n        \"個人定位與內容主張\",\n        \"內容導流與私域入口\",\n        \"第一版 Offer 與定價\",\n        \"Skool 課程與社群架構\",\n        \"成交、續費與升級路徑\"\n      ],\n      takeaways: [\n        { title: \"一個清楚的商業方向\", desc: \"目前最適合做課程、社群、顧問或服務方案\" },\n        { title: \"一條可執行的漏斗\", desc: \"內容要把人帶去哪裡，私域如何承接與轉換\" },\n        { title: \"一份優先順序\", desc: \"先做什麼、晚點做什麼、哪些事情先停止\" }\n      ],\n      cases: [\n        { name: \"凡氏可行\", field: \"關係內容\", slotId: \"case-fanshi\", bgCss: srcUrl(\"case1\", \"uploads/opt-case1.jpg\"), placeholder: \"放置 凡氏可行 截圖\", desc: \"從沒有產品、零起號開始做自媒體，一路收集客戶見證與需求，生成自己的產品，最後透過 Skool 私域完成變現。\", tags: \"零起號 → 收集需求 → 生成產品 → Skool 私域變現\", note: \"目前月收入 30 萬｜從零產品，到一份能養活自己的事業。\" },\n        { name: \"Miranda\", field: \"運動按摩／專業服務\", slotId: \"case-miranda\", bgCss: srcUrl(\"case3\", \"uploads/opt-case3.jpg\"), placeholder: \"放置 Miranda 截圖\", desc: \"把運動按摩的服務與經驗轉到線上，做成課程與顧問式產品。移民美國後事業沒有停，線上收入超過原本線下開店的月收入。\", tags: \"線下服務 → 線上課程 → 顧問式產品\", note: \"目前月收入 30–50 萬｜移民美國，事業沒有停。\" },\n        { name: \"唐芯\", field: \"表達訓練／教育社群\", slotId: \"case-tangxin\", bgCss: srcUrl(\"case2\", \"uploads/opt-case2.jpg\"), placeholder: \"放置 唐芯 截圖\", desc: \"把一次性的現場教學，轉成可以持續交付、會員續費的年度訂閱社群，讓表達訓練走進具體生活場景與學習路徑。\", tags: \"現場教學 → 年度社群 → 續費升級\", note: \"單場銷售活動營收 40 萬。\" }\n      ],\n      testimonials: [\n        { slotId: \"tm-1\", name: \"Dex Lu｜投資陪跑\", result: \"MVP：一週上線 → 成交 3 位客戶\", bgCss: srcUrl(\"tm1\", \"uploads/opt-tm1.jpg\"), quote: \"Dex 原本是上班族，透過模組找到定位後，短短不到一週就做出自己的 MVP 並馬上變現，目前已成交 3 位客戶。\" },\n        { slotId: \"tm-2\", name: \"Steven Lu｜自律挑戰\", result: \"MVP：30 天挑戰 → Skool 變現 660 美金\", bgCss: srcUrl(\"tm2\", \"uploads/opt-tm2.jpg\"), quote: \"Steven 原本是會計師，手上完全沒有產品。我們陪他設計出第一版方案——30 天自律挑戰，透過 Skool 成交第一位客戶，變現 660 美金。\" },\n        { slotId: \"tm-3\", name: \"Kimmy｜美業老闆\", result: \"Offer 簡化：20 幾個方案 → 3 個高單價方案\", bgCss: srcUrl(\"tm3\", \"uploads/opt-tm3.jpg\"), quote: \"Kimmy 把 20 幾個方案簡化成 3 個高單價方案。員工人數沒變、忙碌程度也沒變，月營收多了 50 萬，客戶品質與服務反而更好。\" },\n        { slotId: \"tm-4\", name: \"余玟萱｜保險業務\", result: \"社群優化 → 兩週數十位諮詢、成交近 10 位\", bgCss: srcUrl(\"tm4\", \"uploads/opt-tm4.jpg\"), quote: \"過去靠線下跑訪的保險業務，透過社群優化與銷售頁更新，把自己變成名單磁鐵。兩週內多了數十位諮詢，成交近 10 位壽險與高資產傳承客戶，客戶開始主動上門詢問。\" },\n        { slotId: \"tm-5\", name: \"方寊｜龍筋老師\", result: \"內容轉型：單週營業額 ＝ 過去六週總和\", bgCss: srcUrl(\"tm5\", \"uploads/opt-tm5.jpg\"), quote: \"不再拍容易被誤會的煽情影片，改用一支麥克風口播專業內容。兩週後，單週營業額等於過去六週的總和，現在更開了實體課，持續成交高單價培訓，從線下師傅轉型成線上講師。\" }\n      ],\n      fitList: [\n        \"你已經有一項專業、服務或可分享的經驗\",\n        \"你願意做內容，也願意跟市場持續互動\",\n        \"你想建立自己的私域與長期客戶資產\",\n        \"你願意先做第一版，再根據市場調整\",\n        \"你想把 Skool 做成一個生意
